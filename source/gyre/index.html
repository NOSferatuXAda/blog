<p class="surreal-gyre__intro">水在转。</p>
<p class="surreal-gyre__text">暖的在上，冷的在下。中间那层，没人问起。</p>
<p class="surreal-gyre__text">有的浮上去，有的沉下来。浮上去的，成了字；沉下去的，成了数。写完了，数完了，水又转回来。</p>
<p class="surreal-gyre__text">环没有头尾。以为站住的地方，一错眼就偏了。</p>
<p class="surreal-gyre__text">转着。其余的不必问。</p>
