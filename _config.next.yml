# NexT 主题自定义配置（覆盖主题默认值）
# 主题文档: https://theme-next.js.org/docs/theme-settings/
# 说明：本站为「黑 / 红 / 灰 / 白 + Surreal」定制风格，
#       所有未确定内容统一使用 unknown 作为占位符。

# 主题风格：Muse | Mist | Pisces | Gemini
scheme: Gemini

# 全局配色固定为黑红灰白（关闭自动深色模式，避免覆盖自定义色板）
darkmode: false

# 导航栏：四个核心类别（中文键名会直接作为显示文案）
menu:
  首页: / || fa fa-home
  分类: /categories/ || fa fa-layer-group
  关于: /about/ || fa fa-user
  致谢: /thanks/ || fa fa-heart

menu_settings:
  badges: false
  icons: true

# 社交链接占位（作者窗口使用自定义侧边栏卡片，见 source/_data/sidebar.njk）
social:
  unknown: /unknown/ || fa fa-question

social_icons:
  enable: true
  icons_only: false
  transition: false

# 侧边栏作者窗口头像（红底白色生物动画 GIF）
avatar:
  url: /images/avatar-surreal.gif
  rounded: false
  rotated: false

sidebar:
  position: left
  display: post
  padding: 18
  offset: 12

# 关闭 NexT 默认的站点统计块（由自定义作者窗口承载）
site_state: false

# 文章目录（保留给未来的文章页）
toc:
  enable: false
  number: true
  wrap: true
  expand_all: false
  max_depth: 4

# 阅读进度条
reading_progress:
  enable: true
  start_at: left
  position: top
  color: "#ff1d1d"
  height: 2px

# 返回顶部
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# 页面切换动画
motion:
  enable: false
  async: true
  transition:
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

# 代码块：统一使用深色高亮主题，配合黑红配色
# 关闭一键复制按钮，并关闭语言标识（大标题/水印）
codeblock:
  theme:
    light: stackoverflow-dark
    dark: stackoverflow-dark
  copy_button:
    enable: false
    style: flat
  language: false

# 行内代码 / 代码块基底配色（供主题变量使用）
highlight:
  light:
    background: "#0a0a0a"
    foreground: "#f2f2f2"
  dark:
    background: "#0a0a0a"
    foreground: "#f2f2f2"

# 图片灯箱
fancybox: true

# 站内搜索：首页不再展示文章列表，暂关闭搜索入口
local_search:
  enable: false
  trigger: auto
  top_n_per_article: 1
  unescape: false
  preload: false

# 页脚
footer:
  since: 2026
  icon:
    name: fa fa-circle
    animated: false
    color: "#ff1d1d"
  copyright:
  powered: true

# 浏览器主题色
theme_color:
  light: "#ff1d1d"
  dark: "#ff1d1d"

# 自定义变量 / 自定义样式 / 自定义侧边栏作者卡片
custom_file_path:
  variable: source/_data/variables.styl
  style: source/_data/styles.styl
  sidebar: source/_data/sidebar.njk

# 资源本地化，不依赖境外 CDN
vendors:
  internal: local
  plugins: local
